<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centro de Documentación Digital</title>
<style>
body{margin:0;font-family:Segoe UI,Arial;background:#eef3f8}
header{background:#0b5cab;color:#fff;padding:22px;text-align:center}
.wrap{max-width:900px;margin:auto;padding:20px}
.search{width:100%;padding:12px;border-radius:8px;border:1px solid #bbb;font-size:16px}
details{background:#fff;border-radius:10px;margin:15px 0;box-shadow:0 2px 6px rgba(0,0,0,.15)}
summary{padding:15px;font-weight:bold;cursor:pointer}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid #eee}
.btn{background:#0b5cab;color:#fff;padding:8px 12px;border-radius:6px;text-decoration:none}
footer{text-align:center;color:#666;padding:20px}
</style></head><body>
<header><h1>Centro de Documentación Digital</h1>
<p>Escanee el QR y descargue sus formularios oficiales.</p></header>
<div class="wrap">
<input id="q" class="search" onkeyup="f()" placeholder="Buscar formulario...">
<div id="c">
<details open><summary>Prestaciones Médicas</summary>
<div class="item"><span>📄 Cambio de Médico</span><a class="btn" href="formularios/Cambio_Medico.pdf">Descargar</a></div>
<div class="item"><span>📄 Autorización</span><a class="btn" href="formularios/Autorizacion.pdf">Descargar</a></div>
</details>
<details><summary>Afiliaciones</summary>
<div class="item"><span>📄 Requisitos</span><a class="btn" href="formularios/afiliaciones.pdf">Descargar</a></div>
</details>
<details><summary>Reclamos</summary>
<div class="item"><span>📄 Reclamo General</span><a class="btn" href="formularios/Reclamo.pdf">Descargar</a></div>
</details>
</div></div>
<footer>Desarrollado por Área DIVTEC</footer>
<script>
<div class="contenedor-formularios">
    <!-- Nota que se usa "formularios/" en minúscula si la carpeta es en minúscula, o "Formularios/" si empieza con mayúscula -->
    <a href="formularios/contacto.html" class="item">Formulario de Contacto</a>
    <a href="formularios/registro.html" class="item">Formulario de Registro</a>
    <a href="formularios/encuesta.html" class="item">Formulario de Encuesta</a>
</div>
function f() {
    let t = document.getElementById('q').value.toLowerCase();
    document.querySelectorAll(".item").forEach(i => {
        i.style.display = i.innerText.toLowerCase().includes(t) ? "flex" : "none";
    });
}
</script></body></html>
